name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scrub gate can scan it

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The core scripts and the whole test suite are stdlib-only: no pip
      # install, no browser, no network. pandoc is optional and not required
      # by any test in this suite.
      - name: Run the offline test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: PII scrub gate (working tree + full git history)
        run: python3 scripts/scrub_check.py --all

      - name: Every script exposes --help
        run: |
          set -e
          for s in scripts/*.py; do
            python3 "$s" --help >/dev/null
          done
