# Generic pack — the starting point for a role family no pack covers yet.
# /setup does not run on this pack directly: it forks it into the workspace
# under the user's own domain name
#   python3 scripts/packs.py --fork generic --as <domain>
# and fills in the competency set derived from their own documents. The fork
# is theirs to edit, travels with /sync, and can later be contributed back
# with `--export`. See CONTRIBUTING.md and docs/packs.md.
name: generic
description: Minimal domain-agnostic fallback pack. Role taxonomy and ATS lexicon are generated at setup from the user's own documents.
version: "1.0"

# Intentionally incomplete: a starting point to fork, not a pack to ship.
# scripts/packs.py skips the finished-pack checks for this and refuses to
# export it under this name.
scaffold: true

figure_nouns: [months, weeks, days, hours, years, people, teams, clients,
               customers, users, projects, locations]

files:
  roles: roles.yaml
  evaluation: evaluation.md
  ats_keywords: ats_keywords.yaml
  ats_synonyms: ats_synonyms.yaml
