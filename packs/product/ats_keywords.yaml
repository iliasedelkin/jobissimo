# ATS keyword taxonomy — used by scripts/ats_score.py.
# NOTE: the scorer EXTRACTS keyword candidates from the JD text itself
# (salient uni/bigrams, freq>=2). This taxonomy is not the candidate SOURCE —
# it is a lexicon/normaliser: it classifies extracted terms as hard vs soft,
# and any taxonomy term present in the JD is unioned in as a known-skill
# booster. (A taxonomy∩JD candidate set understates domain vocabulary the
# list never contained and inflates coverage toward 100%.)
#
# Format: section name + "- term" lines. Keep soft_skills current so
# classification stays accurate; add hard terms only for known-skill boosting.
#
# TRUTH RULE: a missing keyword may only be added to the CV if it is evidenced
# in knowledge/ (check evidence_map.md / skills_inventory.md first). Otherwise
# it goes to gap_suggestions.md.

