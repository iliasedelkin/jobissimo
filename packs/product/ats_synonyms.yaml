# ATS synonym table — used by scripts/ats_score.py for keyword normalization.
# Format (kept deliberately simple; parsed by a minimal stdlib reader):
#   canonical term: [synonym, synonym, ...]
# Matching is case-insensitive with light stemming. A JD keyword counts as
# covered if the keyword itself OR any synonym of its canonical group appears
# in the CV. Add entries here when /optimise reports recurring near-misses.
# NOTE: synonyms only bridge WORDING, never FACTS — a synonym must describe the
# same evidenced skill, not a neighboring one (that would be a truth violation).
# Language-specific bridges live in locales/<code>.yaml, merged per the
# configured languages.

